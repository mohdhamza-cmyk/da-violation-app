name: Build Android APK

on:
  push:
    branches: [claude/rider-training-sandbox-hb0kr9, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create assets directory
        working-directory: mobile
        run: mkdir -p assets/images

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name=rider_training_app --org=com.ridertraining --overwrite .
          git checkout android/app/src/main/AndroidManifest.xml lib/ pubspec.yaml
          # app_links 6.x references flutter.compileSdkVersion in plugin subprojects;
          # inject it into the root build.gradle so all subprojects can find it
          cat >> android/build.gradle << 'GRADLE'

          allprojects {
              ext.flutter = [compileSdkVersion: 34, targetSdkVersion: 34, minSdkVersion: 21, ndkVersion: '25.1.8937393']
          }
          GRADLE

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-training-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
