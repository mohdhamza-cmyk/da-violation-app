name: Build Android APK

on:
  push:
    branches: [claude/rider-training-sandbox-hb0kr9, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create assets directory
        working-directory: mobile
        run: mkdir -p assets/images

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name=rider_training_app --org=com.ridertraining --overwrite .
          git checkout android/app/src/main/AndroidManifest.xml lib/ pubspec.yaml
          # KGP 2.1.0: package_info_plus 9.x uses kotlin-stdlib 2.2.0; KGP 1.x cannot read 2.x metadata
          # AGP 8.1.0 (Flutter 3.24 default) is compatible with KGP 2.x per JetBrains docs
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle
          # AGP 7.3.0 (Flutter 3.24 default) < KGP 2.1.0 minimum of 7.3.1; bump to 7.4.2 (compatible with Gradle 7.6.3)
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "7.4.2"/' android/settings.gradle
          sed -i 's/id "com.android.library" version "[^"]*"/id "com.android.library" version "7.4.2"/' android/settings.gradle
          # app_links 6.x needs ext.flutter; compileSdk 35 for flutter_plugin_android_lifecycle
          cat >> android/build.gradle << 'GRADLE'

          allprojects {
              ext.flutter = [compileSdkVersion: 35, targetSdkVersion: 35, minSdkVersion: 21, ndkVersion: '25.1.8937393']
          }
          GRADLE

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-training-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
