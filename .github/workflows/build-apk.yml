name: Build Android APK

on:
  push:
    branches: [claude/rider-training-sandbox-hb0kr9, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Create assets directory
        working-directory: mobile
        run: mkdir -p assets/images

      - name: Generate Android platform files
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name=rider_training_app --org=com.ridertraining --overwrite .
          # Restore committed config: AndroidManifest (queries/permissions), app/build.gradle
          # (compileSdk 35, minSdk 23, build-tools 35), settings.gradle (AGP 8.6.0, Kotlin 2.1.0),
          # gradle-wrapper.properties (Gradle 8.9), plus app source. This exact toolchain was
          # verified to produce a working release APK.
          git checkout \
            android/app/src/main/AndroidManifest.xml \
            android/app/build.gradle \
            android/settings.gradle \
            android/gradle/wrapper/gradle-wrapper.properties \
            lib/ pubspec.yaml

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rider-training-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
