name: rider_training_app
description: Rider Training Sandbox Platform - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Location & Maps
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # Camera
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # UI
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  # Storage
  flutter_secure_storage: ^9.2.2
  flutter_image_compress: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
